name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kinship:kinship@localhost:5432/kinship?schema=public

jobs:
  web-static:
    name: Web — lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint and typecheck
        run: npm run lint && npx tsc --noEmit

      - name: Unit tests
        run: npm run test

  web-build:
    name: Web — migrate, seed, production build
    runs-on: ubuntu-latest
    needs: web-static
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinship
          POSTGRES_PASSWORD: kinship
          POSTGRES_DB: kinship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinship -d kinship"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Build Next.js
        run: npm run build

  web-e2e:
    name: Web — Playwright E2E
    runs-on: ubuntu-latest
    needs: web-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinship
          POSTGRES_PASSWORD: kinship
          POSTGRES_DB: kinship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinship -d kinship"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build Next.js (production server for E2E)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_USE_START: "1"
          PLAYWRIGHT_SKIP_DB_BOOTSTRAP: "1"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-output/playwright-report
            playwright-output/test-results
          retention-days: 7

  mobile:
    name: Mobile — typecheck and unit tests
    runs-on: ubuntu-latest
    needs: web-static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-tree-app/package-lock.json

      - name: Install and test family-tree-app
        working-directory: family-tree-app
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --passWithNoTests
