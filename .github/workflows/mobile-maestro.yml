name: Mobile — Maestro smoke

on:
  pull_request:
    paths:
      - "family-tree-app/**"
      - ".github/workflows/mobile-maestro.yml"
  push:
    branches: [main]
    paths:
      - "family-tree-app/**"
      - ".github/workflows/mobile-maestro.yml"
  workflow_dispatch:
    inputs:
      maestro_flow_set:
        description: "Flows to run on emulator (comma-separated paths under family-tree-app/)"
        required: false
        default: "maestro/flows/01-onboarding-private-archive.yaml,maestro/flows/09-demo-onboarding-kay.yaml,maestro/flows/10-archive-lane-switch.yaml,maestro/flows/11-demo-clear-restart.yaml,maestro/flows/12-tree-load-more.yaml"

concurrency:
  group: mobile-maestro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maestro-contracts:
    name: Maestro flow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: family-tree-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-tree-app/package-lock.json

      - name: Install and validate flows
        run: |
          npm ci
          npm run test:maestro:contracts

  build-debug-apk:
    name: Build debug APK
    needs: maestro-contracts
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-tree-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (build)
        run: |
          set -euxo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies and build debug APK
        working-directory: family-tree-app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-debug-apk
          path: family-tree-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

  maestro-emulator-smoke:
    name: Android emulator — Maestro smoke
    needs: build-debug-apk
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAESTRO_CI_FLOWS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.maestro_flow_set || 'maestro/flows/01-onboarding-private-archive.yaml,maestro/flows/09-demo-onboarding-kay.yaml,maestro/flows/10-archive-lane-switch.yaml,maestro/flows/11-demo-clear-restart.yaml,maestro/flows/12-tree-load-more.yaml' }}
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: family-tree-debug-apk
          path: family-tree-app/android/app/build/outputs/apk/debug

      - name: Maestro smoke (API 33 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BOOT_TIMEOUT_SEC: 1200
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1200
          cores: 2
          ram-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # android-emulator-runner runs each script line in a separate shell — no multi-line if/fi here.
          script: family-tree-app/scripts/ci-maestro-smoke.sh

      - name: Upload Maestro debug output
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-smoke-debug
          path: |
            ~/.maestro/tests/**
          retention-days: 5
          if-no-files-found: ignore
