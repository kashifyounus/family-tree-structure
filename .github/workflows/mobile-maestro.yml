name: Mobile — Maestro smoke

on:
  pull_request:
    paths:
      - "family-tree-app/**"
      - ".github/workflows/mobile-maestro.yml"
  push:
    branches: [main]
    paths:
      - "family-tree-app/**"
  workflow_dispatch:

concurrency:
  group: mobile-maestro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maestro-onboarding-smoke:
    name: Android emulator — onboarding flow
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-tree-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          set -euxo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "system-images;android-30;google_apis;x86_64" \
            "emulator"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies and build debug APK
        working-directory: family-tree-app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Maestro onboarding smoke (API 30 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            chmod +x family-tree-app/scripts/ci-maestro-smoke.sh
            family-tree-app/scripts/ci-maestro-smoke.sh

      - name: Upload Maestro debug output
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-smoke-debug
          path: |
            ~/.maestro/tests/**
          retention-days: 5
          if-no-files-found: ignore
