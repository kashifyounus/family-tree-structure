appId: com.mughals.familytree
tags:
  - smoke
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    notVisible:
      id: genealogy-boot-screen
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: onboarding-kay-showcase
    timeout: 300000
- tapOn:
    id: onboarding-kay-showcase
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 120000
- tapOn:
    text: "Account"
- extendedWaitUntil:
    visible:
      id: account-screen
    timeout: 15000
- tapOn:
    id: account-clear-demo-restart
- extendedWaitUntil:
    visible:
      id: onboarding-get-started
    timeout: 300000
