appId: com.mughals.familytree
tags:
  - smoke
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    notVisible:
      id: genealogy-boot-screen
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 300000
- scrollUntilVisible:
    element:
      id: onboarding-kay-showcase
- tapOn:
    id: onboarding-kay-showcase
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 120000
- assertVisible:
    id: home-demo-banner
- tapOn:
    text: "Members"
- extendedWaitUntil:
    visible:
      id: members-screen
    timeout: 15000
- assertVisible:
    id: members-demo-banner
- assertVisible:
    id: members-first-card
