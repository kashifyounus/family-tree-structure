appId: com.mughals.familytree
tags:
  - smoke
  - demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    notVisible:
      id: genealogy-boot-screen
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: onboarding-get-started
    timeout: 300000
- tapOn:
    id: onboarding-kay-showcase
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 120000
- tapOn:
    id: home-tree
- extendedWaitUntil:
    visible:
      id: local-tree-graph-webview
    timeout: 30000
- assertVisible:
    id: tree-demo-banner
- tapOn:
    id: tree-load-siblings
- extendedWaitUntil:
    visible:
      id: local-tree-graph-webview
    timeout: 15000
- tapOn:
    id: tree-load-parents
- extendedWaitUntil:
    visible:
      id: local-tree-graph-webview
    timeout: 15000
- tapOn:
    id: tree-load-children
- extendedWaitUntil:
    visible:
      id: local-tree-graph-webview
    timeout: 15000
- assertVisible:
    id: tree-load-parents
- assertVisible:
    id: tree-load-siblings
- assertVisible:
    id: tree-load-children
